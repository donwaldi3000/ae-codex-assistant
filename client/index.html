<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>ae-agent-skill</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #323232;
            color: #E0E0E0;
            padding: 0;
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .layout {
            display: grid;
            grid-template-columns: 1.2fr 1fr;
            gap: 10px;
            padding: 10px;
            min-height: 0;
            flex: 1;
        }
        .panel {
            background: #2a2a2a;
            border: 1px solid #444;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }
        .panel h2 {
            margin: 0;
            font-size: 12px;
            padding: 8px 10px;
            border-bottom: 1px solid #444;
            letter-spacing: 0.03em;
            text-transform: uppercase;
        }
        .panel-body {
            padding: 10px;
            overflow: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .row {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .row.wrap {
            flex-wrap: wrap;
        }
        label {
            font-size: 12px;
            color: #bdbdbd;
        }
        input[type="text"], input[type="password"], textarea, pre {
            background: #1f1f1f;
            color: #f2f2f2;
            border: 1px solid #4a4a4a;
            border-radius: 4px;
            padding: 6px;
            font-family: monospace;
            font-size: 12px;
            width: 100%;
            box-sizing: border-box;
        }
        #prompt {
            min-height: 90px;
            resize: vertical;
        }
        #plan-summary {
            min-height: 56px;
            white-space: pre-wrap;
            margin: 0;
        }
        #ops-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .op-item {
            border: 1px solid #505050;
            border-radius: 4px;
            padding: 8px;
            background: #222;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .op-header {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            align-items: center;
            font-size: 12px;
        }
        .badges {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        .badge {
            font-size: 11px;
            padding: 2px 6px;
            border-radius: 999px;
            border: 1px solid #666;
            color: #ddd;
        }
        .badge.low { border-color: #2a8f52; color: #7de2a5; }
        .badge.medium { border-color: #ab8e2f; color: #ffd978; }
        .badge.high { border-color: #a14848; color: #ff9c9c; }
        .results {
            white-space: pre-wrap;
            min-height: 120px;
            margin: 0;
        }
        h1 {
            font-size: 14px;
            padding: 10px;
            margin: 0;
            border-bottom: 1px solid #444;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .version {
            font-size: 12px;
            color: #B0B0B0;
        }
        .controls {
            padding: 8px 10px;
            border-bottom: 1px solid #444;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            font-size: 12px;
            align-items: center;
        }
        .control {
            display: flex;
            gap: 6px;
            align-items: center;
        }
        select {
            background: #202020;
            color: #E0E0E0;
            border: 1px solid #4a4a4a;
            border-radius: 4px;
            padding: 2px 4px;
        }
        button {
            background: #2f6fdb;
            color: #fff;
            border: none;
            border-radius: 4px;
            padding: 4px 8px;
            cursor: pointer;
        }
        button:disabled {
            background: #555;
            cursor: default;
        }
        #log {
            flex-grow: 1;
            box-sizing: border-box;
            width: 100%;
            padding: 10px;
            background-color: #282828;
            color: #E0E0E0;
            border: none;
            font-family: monospace;
            white-space: pre-wrap;
            resize: none;
        }
    </style>
</head>
<body>
    <h1>
        <span>ae-agent-skill Logs</span>
        <span class="version" id="panel-version">v-</span>
    </h1>
    <div class="controls">
        <div class="control">
            <label for="risk-mode">Risk</label>
            <select id="risk-mode">
                <option value="Safe">Safe</option>
                <option value="Balanced" selected>Balanced</option>
                <option value="Fast">Fast</option>
            </select>
        </div>
        <div class="control">
            <label for="scope-mode">Scope</label>
            <select id="scope-mode">
                <option value="Selection">Selection</option>
                <option value="ActiveComp" selected>Active Comp</option>
                <option value="Project">Project</option>
            </select>
        </div>
        <div class="control">
            <label for="approval-override">Override</label>
            <select id="approval-override">
                <option value="Default" selected>Default</option>
                <option value="AskThisTime">Ask this time</option>
                <option value="AutoApplyThisTime">Auto apply this time</option>
            </select>
        </div>
        <button id="save-agent-settings">Save</button>
    </div>
    <div class="layout">
        <section class="panel">
            <h2>Agent Prompt</h2>
            <div class="panel-body">
                <div class="row wrap">
                    <label for="codex-model">Codex Model</label>
                    <input id="codex-model" type="text" value="gpt-5-mini" />
                </div>
                <div class="row wrap">
                    <button id="check-codex-login">Check Codex Login</button>
                    <span id="codex-login-status">Status unknown</span>
                </div>
                <label for="prompt">Task</label>
                <textarea id="prompt" placeholder="Example: Build a 2D controller rig for selected layers and fix expression errors."></textarea>
                <div class="row wrap">
                    <button id="generate-plan">Generate Plan</button>
                    <button id="refresh-scan">Refresh Scan</button>
                </div>
                <label>Plan Summary</label>
                <pre id="plan-summary"></pre>
            </div>
        </section>
        <section class="panel">
            <h2>Operations</h2>
            <div class="panel-body">
                <div class="row wrap">
                    <button id="select-all-ops">Select all</button>
                    <button id="clear-all-ops">Clear all</button>
                    <button id="preview-ops">Preview Selected</button>
                    <button id="apply-ops">Apply Selected</button>
                </div>
                <div id="ops-list"></div>
                <label>Execution Results</label>
                <pre class="results" id="results"></pre>
            </div>
        </section>
    </div>
    <textarea id="log" readonly></textarea>

    <script type="text/javascript" src="./CSInterface.js"></script>
    <script type="text/javascript" src="./lib/runtime.js"></script>
    <script type="text/javascript" src="./lib/logging.js"></script>
    <script type="text/javascript" src="./lib/bridge_utils.js"></script>
    <script type="text/javascript" src="./lib/request_handlers_shape.js"></script>
    <script type="text/javascript" src="./lib/request_handlers_scene.js"></script>
    <script type="text/javascript" src="./lib/request_handlers_essential.js"></script>
    <script type="text/javascript" src="./lib/request_handlers_timeline.js"></script>
    <script type="text/javascript" src="./lib/request_handlers_layer_structure.js"></script>
    <script type="text/javascript" src="./lib/request_handlers_agent.js"></script>
    <script type="text/javascript" src="./lib/request_handlers.js"></script>
    <script type="text/javascript" src="./lib/server.js"></script>
    <script type="text/javascript" src="./main.js"></script>
</body>
</html>
